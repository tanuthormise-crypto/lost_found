<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Report Found Item | Lost & Found</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">
```

</head>

<body class="dashboard-page">

```
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="user_dashboard.html">
            Lost & Found
        </a>

        <div>
            <a href="user_dashboard.html" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="../auth/login.html" class="btn btn-danger">
                Logout
            </a>
        </div>

    </div>
</nav>


<!-- Main Content -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="dashboard-card">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Report Found Item
                    </h2>

                    <p class="text-muted">
                        Provide details about the item you found.
                    </p>

                </div>


                <!-- Found Item Form -->
                <form id="foundItemForm">

                    <!-- Item Name -->
                    <div class="mb-3">

                        <label for="itemName" class="form-label">
                            Item Name
                        </label>

                        <input
                            type="text"
                            id="itemName"
                            class="form-control"
                            placeholder="Example: Black Wallet"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label for="category" class="form-label">
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="electronics">
                                Electronics
                            </option>

                            <option value="documents">
                                Documents
                            </option>

                            <option value="wallet">
                                Wallet
                            </option>

                            <option value="jewellery">
                                Jewellery
                            </option>

                            <option value="clothing">
                                Clothing
                            </option>

                            <option value="bag">
                                Bag
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Description -->
                    <div class="mb-3">

                        <label for="description" class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            placeholder="Describe the item you found..."
                            required
                        ></textarea>

                    </div>


                    <!-- Date and Location -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="foundDate" class="form-label">
                                Date Found
                            </label>

                            <input
                                type="date"
                                id="foundDate"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="foundLocation" class="form-label">
                                Location Found
                            </label>

                            <input
                                type="text"
                                id="foundLocation"
                                class="form-control"
                                placeholder="Example: College Campus"
                                required
                            >

                        </div>

                    </div>


                    <!-- Color -->
                    <div class="mb-3">

                        <label for="color" class="form-label">
                            Item Color
                        </label>

                        <input
                            type="text"
                            id="color"
                            class="form-control"
                            placeholder="Example: Black"
                        >

                    </div>


                    <!-- Contact -->
                    <div class="mb-3">

                        <label for="contact" class="form-label">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            id="contact"
                            class="form-control"
                            placeholder="Enter your contact number"
                            required
                        >

                    </div>


                    <!-- Image -->
                    <div class="mb-4">

                        <label for="itemImage" class="form-label">
                            Upload Item Image
                        </label>

                        <input
                            type="file"
                            id="itemImage"
                            class="form-control"
                            accept="image/*"
                        >

                        <small class="text-muted">
                            Upload an image if you have one.
                        </small>

                    </div>


                    <!-- Submit -->
                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg"
                        >
                            Report Found Item
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 Lost & Found Management System
    </p>

</footer>


<script src="../js/user.js"></script>
```

</body>
</html>
