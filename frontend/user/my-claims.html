
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims - Lost & Found</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="user-dashbord.html">
                Lost & Found
            </a>
            <div>
                <a href="user-dashbord.html" class="btn btn-outline-light me-2">
                    Home
                </a>
                <a href="browseitem.html" class="btn btn-outline-light me-2">
                    Browse Items
                </a>
                <a href="my-reports.html" class="btn btn-outline-light">
                    My Reports
                </a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>My Claims</h2>
                <p class="text-muted">
                    View the claims you have submitted.
                </p>
            </div>
            <div>
                <select id="claimFilter" class="form-select">
                    <option value="all">All Claims</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Item</th>
                        <th>Type</th>
                        <th>Claim Message</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="claimsTableBody">
                </tbody>
            </table>
        </div>
        <div id="noClaims" class="text-center mt-4">
            <p class="text-muted">
                No claims found.
            </p>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/my-claims.js"></script>
</body>
</html>
