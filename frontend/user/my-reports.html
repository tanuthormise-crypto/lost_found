<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-page">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="user_dashbord.html">
                Lost & Found
            </a>
            <div>
                <a href="browse-item.html" class="btn btn-outline-light me-2">
                    Browse Items
                </a>
                <a href="user_dashbord.html" class="btn btn-outline-light me-2">
                    Dashboard
                </a>
                <a href="../auth/login.html" class="btn btn-danger">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">
                My Reports
            </h2>
            <p class="text-muted">
                View and manage the items you have reported.
            </p>
        </div>
        <div class="dashboard-card mb-4">
            <div class="row align-items-end">
                <div class="col-md-4">
                    <label for="reportFilter" class="form-label">
                        Filter Reports
                    </label>
                    <select id="reportFilter" class="form-select">
                        <option value="all">
                            All Reports
                        </option>
                        <option value="lost">
                            Lost Items
                        </option>
                        <option value="found">
                            Found Items
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="dashboard-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>
                                Item </th>
                            <th>
                                Type
                            </th>
                            <th>
                                Category
                            </th>
                            <th>
                                Location
                            </th>
                            <th>
                                Date
                            </th>
                            <th>
                                Status
                            </th>
                            <th>
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody"> </tbody>
                </table>
            </div>
        </div>
        <div id="noReports" class="text-center mt-4 d-none">
            <h5>
                No reports found
            </h5>
            <p class="text-muted">
                You haven't reported any items yet.
            </p>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Lost & Found Management System
        </p>
    </footer>
    <script src="../js/api.js"></script>
<script src="../js/my-reports.js"></script>
  
</body>

</html>
