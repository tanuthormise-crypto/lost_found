<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Lost Item | Lost & Found</title>
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-page">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="user_dashboard.html">
            Lost & Found
        </a>
        <div>
            <a href="user_dashboard.html" class="btn btn-outline-light me-2">
                Dashboard
            </a>
            <a href="../auth/login.html" class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="dashboard-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">
                        Report Lost Item
                    </h2>
                    <p class="text-muted">
                        Provide details about the item you lost.
                    </p>
                </div>
                <form id="lostItemForm">>
                    <div class="mb-3">
                        <label for="itemName" class="form-label">
                            Item Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="itemName"
                            placeholder="Example: Black Wallet"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">
                            Category
                        </label>
                        <select id="category" class="form-select" required>
                            <option value="">
                                Select Category
                            </option>
                            <option value="electronics">
                                Electronics
                            </option>
                            <option value="documents">
                                Documents
                            </option>
                            <option value="wallet">
                                Wallet
                            </option>
                            <option value="jewellery">
                                Jewellery
                            </option>
                            <option value="clothing">
                                Clothing
                            </option>
                            <option value="bag">
                                Bag
                            </option>
                            <option value="other">
                                Other
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description
                        </label>
                        <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            placeholder="Describe your item in detail..."
                            required
                        ></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="lostDate" class="form-label">
                                Date Lost
                            </label>
                            <input
                                type="date"
                                id="lostDate"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lostLocation" class="form-label">
                                Location Lost
                            </label>
                            <input
                                type="text"
                                id="lostLocation"
                                class="form-control"
                                placeholder="Example: College Campus"
                                required
                            >
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="color" class="form-label">
                            Item Color
                        </label>
                        <input
                            type="text"
                            id="color"
                            class="form-control"
                            placeholder="Example: Black"
                        >
                    </div>
                    <div class="mb-3">
                        <label for="contact" class="form-label">
                            Contact Number
                        </label>
                        <input
                            type="tel"
                            id="contact"
                            class="form-control"
                            placeholder="Enter your contact number"
                            required
                        >
                    </div>
                    <div class="mb-4">
                        <label for="itemImage" class="form-label">
                            Upload Item Image
                        </label>
                        <input
                            type="file"
                            id="itemImage"
                            class="form-control"
                            accept="image/*"
                        >
                        <small class="text-muted">
                            Upload an image if you have one.
                        </small>
                    </div>
                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            Report Lost Item
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">
        © 2026 Lost & Found Management System
    </p>
</footer>
<script src="../js/api.js"></script>
<script src="../js/user.js"></script>
</body>
</html>
