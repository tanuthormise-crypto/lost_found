<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-page">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="user_dashboard.html">
                Lost & Found
            </a>
            <div>
                <a href="browse-item.html" class="btn btn-outline-light me-2">
                    Browse Items </a>
                <a href="user_dashbord.html" class="btn btn-outline-light me-2">
                    Dashboard </a>
                <a href="../auth/login.html" class="btn btn-danger">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="dashboard-card">
                    <div class="mb-3">
                        <span id="itemStatus" class="badge bg-danger">
                            LOST ITEM</span>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-5">
                            <div class="border rounded d-flex align-items-center justify-content-center"
                                style="height: 350px;">
                                <div class="text-center text-muted">
                                    <div style="font-size: 60px;">
                                        📱
                                    </div>
                                    <p class="mt-2">
                                        Item Image
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <h2 id="itemTitle" class="fw-bold">Black Samsung Phone</h2>
                            <p class="text-muted">
                                Electronics
                            </p>
                            <hr>
                            <div class="mb-3">
                                <h6 class="fw-bold">
                                    Description
                                </h6>
                                <p id="itemDescription" class="text-muted">
                                    Lost near college campus.
                                </p>
                            </div>
                            <div class="mb-3">
                                <h6 class="fw-bold">
                                    Color
                                </h6>
                                <p>
                                    Black
                                </p>
                            </div>
                            <div class="mb-3">
                                <h6 class="fw-bold">
                                    Date Lost
                                </h6>
                                <p id="itemDate">2026-09-10</p>
                            </div>
                            <div class="mb-3">
                                <h6 class="fw-bold">
                                    Location
                                </h6>
                                <p id="itemLocation">College Campus</p>
                            </div>
                            <div class="mb-4">
                                <h6 class="fw-bold">
                                    Reported By
                                </h6>
                                <p id="reportedBy">Tanu</p>
                            </div>
                            <textarea id="claimMessage" class="form-control mb-3" rows="3"
                                placeholder="Why do you believe this item belongs to you?" required></textarea>
                            <button id="claimBtn" class="btn btn-primary btn-lg w-100">
                                Claim This Item
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Lost & Found Management System
        </p>
    </footer>
    <script src="../js/api.js"></script>
    <script src="../js/item-details.js"></script>
</body>

</html>
