<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Items | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-page">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="admin_dashboard.html">
                Lost & Found Admin
            </a>
            <div>
                <a href="admin_dashboard.html" class="btn btn-outline-light me-2">
                    Dashboard
                </a>
                <a href="users.html" class="btn btn-outline-light me-2">
                    Users
                </a>
                <a href="reports.html" class="btn btn-outline-light me-2">
                    Reports
                </a>
                <a href="../auth/login.html" class="btn btn-danger">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">
                Manage Items
            </h2>
            <p class="text-muted">
                View and manage all lost and found items.
            </p>
        </div>
        <div class="dashboard-card mb-4">
            <div class="row g-3">
                <div class="col-md-5">
                    <label for="itemSearch" class="form-label">
                        Search Item
                    </label>
                    <input type="text" id="itemSearch" class="form-control" placeholder="Search by item name...">
                </div>
                <div class="col-md-3">
                    <label for="itemType" class="form-label">
                        Item Type
                    </label>
                    <select id="itemType" class="form-select">
                        <option value="all">
                            All Items
                        </option>
                        <option value="lost">
                            Lost
                        </option>
                        <option value="found">
                            Found
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="itemStatus" class="form-label">
                        Status
                    </label>
                    <select id="itemStatus" class="form-select">
    <option value="all">All</option>
    <option value="open">Open</option>
    <option value="claimed">Claimed</option>
</select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="itemFilterBtn" class="btn btn-primary w-100">
                        Filter
                    </button>
                </div>
            </div>
        </div>
        <div class="dashboard-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>
                                ID
                            </th>
                            <th>
                                Item
                            </th>
                            <th>
                                Type
                            </th>
                           
                            <th>
                                Reported By
                            </th>
                            <th>
                                Location
                            </th>
                            <th>
                                Status
                            </th>
                            <th>
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody"> </tbody>
                </table>
            </div>
        </div>
        <div id="noItems" class="text-center mt-4 d-none">
            <h5>
                No items found
            </h5>
            <p class="text-muted">
                Try changing your filters.
            </p>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Lost & Found Management System
        </p>
    </footer>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
