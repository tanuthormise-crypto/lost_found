<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reports | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-page">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="admin_dashbord.html">
                Lost & Found Admin
            </a>
            <div>
                <a href="admin_dashbord.html" class="btn btn-outline-light me-2">
                    Dashboard
                </a>
                <a href="users.html" class="btn btn-outline-light me-2">
                    Users
                </a>
                <a href="../auth/login.html" class="btn btn-danger">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">
                Manage Reports
            </h2>
            <p class="text-muted">
                Review and manage lost and found item reports.
            </p>
        </div>
        <div class="dashboard-card mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="reportSearch" class="form-label">
                        Search
                    </label>
                    <input type="text" id="reportSearch" class="form-control" placeholder="Search item or user...">
                </div>
                <div class="col-md-3">
                    <label for="reportType" class="form-label">
                        Type
                    </label>
                    <select id="reportType" class="form-select">
                        <option value="all">
                            All
                        </option>
                        <option value="lost">
                            Lost
                        </option>
                        <option value="found">
                            Found
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="reportStatus" class="form-label">
                        Status
                    </label>
                    <select id="reportStatus" class="form-select">
                        <option value="all">All Status</option>
                        <option value="open">Open</option>
                        <option value="claimed">Claimed</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="filterBtn" class="btn btn-primary w-100">
                        Filter
                    </button>
                </div>
            </div>
        </div>
        <div class="dashboard-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>
                                ID
                            </th>
                            <th>
                                Item
                            </th>
                            <th>
                                Type
                            </th>
                            <th>
                                User
                            </th>
                            <th>
                                Location
                            </th>
                            <th>
                                Date
                            </th>
                            <th>
                                Status
                            </th>
                            <th>
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted">
                                Loading reports...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="noReports" class="text-center mt-4 d-none">
            <h5>
                No reports found
            </h5>
            <p class="text-muted">
                Try changing your filters.
            </p>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Lost & Found Management System
        </p>
    </footer>
    <script src="../js/api.js"></script>
    <script src="../js/report.js"></script>
</body>

</html>
