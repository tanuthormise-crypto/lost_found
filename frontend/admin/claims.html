<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Claims | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="admin_dashbord.html">
                Lost & Found
            </a>
            <div>
                <a href="admin_dashbord.html" class="btn btn-outline-light btn-sm me-2">
                    Dashboard
                </a>
                <a href="users.html" class="btn btn-outline-light btn-sm me-2">
                    Users
                </a>
                <a href="reports.html" class="btn btn-outline-light btn-sm me-2">
                    Reports
                </a>
                <a href="claims.html" class="btn btn-light btn-sm">
                    Claims
                </a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">
                    Manage Claims
                </h2>
                <p class="text-muted mb-0">
                    Review and manage item claims
                </p>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Item</th>
                                <th>Claimed By</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="claimsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    Loading claims...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="claim.js"></script>
</body>
</html>
